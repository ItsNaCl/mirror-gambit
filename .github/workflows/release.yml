# Builds the Windows installer and publishes it as a GitHub release when a version tag is pushed.
# Installed copies of Mirror Gambit read latest.yml from that release to offer the update.
#
# To release: bump "version" in package.json, commit, then
#   git tag v1.2.3 && git push origin v1.2.3
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - run: npm run lint

      - name: Build and publish the installer
        run: npm run release:desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
