# Builds the Windows installer and publishes it as a GitHub release when a version tag is pushed.
# Installed copies of Mirror Gambit read latest.yml from that release to offer the update.
#
# To release: bump "version" in package.json, commit, then
#   git tag v1.2.3 && git push origin v1.2.3
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release can only be a commit that is on main, so a tag pushed from elsewhere builds nothing.
      - name: Check the tag is on main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not on main" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - run: npm run lint

      # electron-builder publishes the installer and the portable exe in parallel, and both
      # would try to create the release. Create it as a draft first; they upload into it.
      - name: Create the draft release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --draft --title "Mirror Gambit ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload the installer
        run: npm run release:desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Installed copies only see published releases, so this is the moment the update goes out.
      - name: Publish the release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
