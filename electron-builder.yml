appId: com.mirrorgambit.app
productName: Mirror Gambit
copyright: Copyright © 2026 Mirror Gambit
electronLanguages: [en-US]

directories:
  output: release
  buildResources: build

# Only the built web app, the bundled main process and the icon go into the package.
# The main process has no runtime dependencies, so node_modules is excluded entirely
# (it would otherwise drag in the 200 MB of Stockfish binaries a second time).
files:
  - dist/**
  - dist-electron/**
  - build/icon.ico
  - package.json
  - "!node_modules/**"

# Keep the engine files as plain files on disk (not inside app.asar) so the
# worker and the 100 MB wasm are streamed straight from the filesystem.
asarUnpack:
  - dist/stockfish/**

npmRebuild: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # --- Code signing (not configured yet) ---------------------------------
  # When you have a certificate, either set the environment variables
  #   CSC_LINK=path\to\certificate.pfx   CSC_KEY_PASSWORD=...
  # before running `npm run build:desktop`, or uncomment and fill in:
  # signtoolOptions:
  #   certificateFile: build/certificate.pfx
  #   certificatePassword: ${env.CSC_KEY_PASSWORD}
  #   signingHashAlgorithms: [sha256]
  #   rfc3161TimeStampServer: http://timestamp.digicert.com
  # -----------------------------------------------------------------------

# Per-user installer with no admin prompt, installed in %LOCALAPPDATA%\Programs\mirror-gambit.
# NSIS (not MSI) because electron-updater can only update NSIS installs.
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Mirror Gambit
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: Mirror-Gambit-Setup-${version}.${ext}

# In-app updates read latest.yml from the GitHub release of this repo.
publish:
  provider: github
  owner: ItsNaCl
  repo: mirror-gambit
  releaseType: release

portable:
  artifactName: Mirror-Gambit-${version}-Portable.${ext}
  requestExecutionLevel: user
